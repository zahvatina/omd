<!-- index.html: Static prototype for the "New Agent" interface -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новый агент — прототип</title>
  <style>
    /* --- GLOBAL STYLES --- */
    :root {
      --bg: #282c34;
      --bg-panel: #323640;
      --fg: #ffffff;
      --accent: #3f51b5;
      --row-height: 40px;
      font-family: "Roboto", Arial, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      color: var(--fg);
      background: var(--bg);
    }

    /* --- LAYOUT --- */
    .wrapper {
      display: grid;
      grid-template-columns: 260px 1fr 340px;
      grid-template-rows: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .panel {
      overflow-y: auto;
      padding: 16px 20px;
      box-sizing: border-box;
    }

    .panel--left {
      background: var(--bg-panel);
      border-right: 1px solid #00000040;
    }

    .panel--right {
      background: var(--bg-panel);
      border-left: 1px solid #00000040;
    }

    h1, h2, h3 {
      margin: 0 0 12px;
      font-weight: 500;
    }

    /* --- LEFT NAV --- */
    .nav-item {
      display: block;
      padding: 10px 12px;
      border-radius: 4px;
      color: var(--fg);
      text-decoration: none;
      font-size: 14px;
    }
    .nav-item:hover, .nav-item.active {
      background: #ffffff14;
    }

    .search-box {
      margin: 16px 0;
      display: flex;
    }
    .search-box input[type="text"] {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 4px 0 0 4px;
    }
    .search-box button {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }

    .user-card {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      opacity: 0.9;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* --- CENTRAL PANEL --- */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab {
      padding: 8px 16px;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      background: #ffffff14;
    }
    .tab.active {
      background: var(--accent);
    }

    .section {
      margin-bottom: 28px;
    }
    .section-title {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .field-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .field-group input, .field-group select {
      height: var(--row-height);
      padding: 0 10px;
      border-radius: 4px;
      border: none;
      min-width: 180px;
    }
    .field-group button {
      background: var(--accent);
      border: none;
      color: #fff;
      border-radius: 4px;
      padding: 0 16px;
      height: var(--row-height);
      cursor: pointer;
    }

    /* --- TABLE ARGUMENTS --- */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin-top: 12px;
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
      height: var(--row-height);
    }
    thead {
      background: #ffffff14;
    }
    tbody tr:nth-child(odd) {
      background: #ffffff08;
    }

    /* --- RIGHT PANEL --- */
    .textarea {
      width: 100%;
      min-height: 180px;
      padding: 10px;
      border-radius: 4px;
      border: none;
      resize: vertical;
      background: #00000040;
      color: var(--fg);
      font-family: inherit;
    }

    .fab-group {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }
    .fab {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      cursor: pointer;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 1199px) {
      .wrapper {
        grid-template-columns: 260px 1fr;
      }
      .panel--right {
        display: none;
      }
    }
    @media (max-width: 899px) {
      .wrapper {
        grid-template-columns: 1fr;
      }
      .panel--left {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- LEFT NAVIGATION PANEL -->
    <nav class="panel panel--left">
      <a href="#" class="nav-item active">Инструменты</a>
      <a href="#" class="nav-item">Агенты</a>
      <a href="#" class="nav-item">Диалоги</a>
      <a href="#" class="nav-item">Аналитика</a>
      <a href="#" class="nav-item">Компании</a>
      <a href="#" class="nav-item">Группы</a>
      <a href="#" class="nav-item">Помощь</a>

      <div class="search-box">
        <input type="text" placeholder="Поиск..." />
        <button>⌕</button>
      </div>

      <div class="user-card">
        <div class="avatar">ДК</div>
        <div>
          <div>Дарья Кряжнева</div>
          <div style="font-size: 12px; opacity: 0.8">kryazheva@example.com</div>
        </div>
      </div>
    </nav>

    <!-- CENTRAL MAIN PANEL -->
    <main class="panel">
      <h1>Новый агент</h1>
      <div class="tabs">
        <div class="tab active">Поведение</div>
        <div class="tab">Симуляции</div>
      </div>

      <!-- NAMES SECTION -->
      <section class="section">
        <h2 class="section-title">Имена</h2>
        <div class="field-group">
          <input type="text" placeholder="Отображаемое имя" />
          <input type="text" placeholder="Внутреннее имя" />
        </div>
      </section>

      <!-- INPUT DATA SECTION -->
      <section class="section">
        <h2 class="section-title">Входные данные</h2>
        <button style="margin-bottom:10px;" onclick="addRow()">+ Аргумент</button>
        <table id="args-table" hidden>
          <thead>
            <tr><th>№</th><th>Название</th><th>Тип</th><th>Действия</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- MODELS SECTION -->
      <section class="section">
        <h2 class="section-title" onclick="toggleAccordion()" style="cursor:pointer;">Используемые модели ⌄</h2>
        <div id="models-body" style="display:none;">
          <div class="field-group">
            <select><option>Yandex</option></select>
            <select><option>Русский</option><option>English</option></select>
            <select><option>OpenAI</option></select>
            <select><option>GPT-4o-mini</option></select>
            <select><option>Yandex</option></select>
            <select><option>Русский</option></select>
            <select><option>Лера</option></select>
            <input type="number" value="1.2" style="width:80px;" />
            <input type="text" placeholder="Роль агента" style="flex:1" />
          </div>
        </div>
      </section>
    </main>

    <!-- RIGHT PANEL -->
    <aside class="panel panel--right">
      <h2 class="section-title">Инструкции</h2>
      <textarea class="textarea" placeholder="Будь доброжелателен..."></textarea>
      <div class="fab-group">
        <div class="fab" title="Сохранить">💾</div>
        <div class="fab" title="Отмена">✖</div>
        <div class="fab" title="Отправить">➡️</div>
        <div class="fab" title="Тест">🧪</div>
      </div>
    </aside>
  </div>

  <script>
    let argCounter = 0;
    function addRow() {
      const table = document.getElementById('args-table');
      const tbody = table.querySelector('tbody');
      table.hidden = false;
      argCounter++;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${argCounter}</td><td>arg_${argCounter}</td><td>string</td><td><button onclick="this.parentNode.parentNode.remove();">🗑️</button></td>`;
      tbody.appendChild(tr);
    }
    function toggleAccordion() {
      const body = document.getElementById('models-body');
      body.style.display = body.style.display === 'none' ? 'block' : 'none';
    }
  </script>
</body>
</html>
